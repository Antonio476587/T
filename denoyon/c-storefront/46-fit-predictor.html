<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>46 · Fit predictor card — DE NOYON</title>
<link rel="stylesheet" href="components.css">
<style>
  main { padding-top: var(--sp-9); padding-bottom: var(--sp-9); }
  .card { max-width: 560px; background: var(--surface-card); border: var(--border-hairline); }
  .card__head { padding: var(--sp-6); border-bottom: var(--border-hairline); }
  .card__head h2 { margin-top: var(--sp-2); }
  form { padding: var(--sp-6); display: grid; gap: var(--sp-5); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }
  select.dn-input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
  .fits { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-2); border: 0; margin: 0; padding: 0; }
  .fits legend { margin-bottom: var(--sp-2); }
  .fit { position: relative; }
  .fit input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .fit span { display: grid; gap: 2px; padding: var(--sp-3); border: var(--border-strong); transition: var(--transition-control); }
  .fit b { font: var(--type-eyebrow); letter-spacing: var(--tr-label); text-transform: uppercase; }
  .fit small { font: var(--type-spec); color: var(--text-muted); }
  .fit input:checked + span { border-color: var(--ink-900); box-shadow: inset 0 0 0 1px var(--ink-900); }
  .fit input:focus-visible + span { outline: 1px solid var(--focus-ring); outline-offset: 3px; }
  .result { padding: var(--sp-6); background: var(--surface-raised); border-top: var(--border-hairline); display: grid; grid-template-columns: auto 1fr; gap: var(--sp-6); align-items: center; }
  .result__size { font: var(--fw-regular) 48px/1 var(--font-mono); padding-right: var(--sp-6); border-right: 1px solid var(--metal-hairline); }
  .result p { color: var(--text-secondary); }
  .result p b { color: var(--text-primary); font-weight: var(--fw-regular); }
  .result .dn-help { margin-top: var(--sp-2); }
  @media (max-width: 520px) { .two, .fits { grid-template-columns: 1fr; } .result { grid-template-columns: 1fr; } .result__size { border-right: 0; border-bottom: 1px solid var(--metal-hairline); padding: 0 0 var(--sp-4); } }
</style>
</head>
<body>
<main class="dn-container">
  <section class="card" aria-labelledby="t">
    <div class="card__head">
      <div class="dn-eyebrow">Fit · Bias tee</div>
      <h2 id="t">Find the size.</h2>
    </div>
    <form id="fit">
      <div class="two">
        <div class="dn-field"><label class="dn-label" for="h">Height, cm</label><input class="dn-input" id="h" name="h" type="number" inputmode="numeric" min="145" max="195" value="170"></div>
        <div class="dn-field"><label class="dn-label" for="usual">Usual size</label>
          <select class="dn-input" id="usual" name="usual"><option>EU 34</option><option>EU 36</option><option selected>EU 38</option><option>EU 40</option><option>EU 42</option></select></div>
      </div>
      <div class="dn-field"><label class="dn-label" for="chest">Chest, cm <span class="dn-muted" style="letter-spacing:0">(optional)</span></label>
        <input class="dn-input" id="chest" name="chest" type="number" inputmode="numeric" min="70" max="120" placeholder="—"></div>
      <fieldset class="fits">
        <legend class="dn-label">How it should fall</legend>
        <label class="fit"><input type="radio" name="pref" value="-1"><span><b>Close</b><small>Follows the body</small></span></label>
        <label class="fit"><input type="radio" name="pref" value="0" checked><span><b>As cut</b><small>The 1974 line</small></span></label>
        <label class="fit"><input type="radio" name="pref" value="1"><span><b>Relaxed</b><small>More drape</small></span></label>
      </fieldset>
    </form>
    <div class="result" aria-live="polite">
      <div class="result__size" id="size">EU 38</div>
      <div><p id="line"></p><p class="dn-help" id="len"></p></div>
    </div>
  </section>
</main>
<script>
  const SIZES = ['EU 34', 'EU 36', 'EU 38', 'EU 40', 'EU 42'];
  const CHEST = [88, 92, 96, 100, 104];       // garment chest, cm (see design 45)
  const LENGTH = [62, 63, 64, 65, 66];        // garment length, cm
  const EASE = { '-1': 4, '0': 8, '1': 12 };  // cm of ease over body chest
  const form = document.getElementById('fit');
  function predict() {
    const h = +form.h.value || 170;
    const pref = form.pref.value;
    let i = SIZES.indexOf(form.usual.value);
    const chest = +form.chest.value;
    if (chest) {
      const need = chest + EASE[pref];
      i = CHEST.findIndex((c) => c >= need);
      if (i === -1) i = SIZES.length - 1;
    } else {
      i = Math.max(0, Math.min(SIZES.length - 1, i + (pref === '1' ? 1 : pref === '-1' ? -1 : 0)));
    }
    const fall = Math.round(LENGTH[i] - h * 0.3 - 8); // cm below the hip line, approximate
    document.getElementById('size').textContent = SIZES[i];
    document.getElementById('line').innerHTML = `<b>${SIZES[i]}.</b> ${fall >= 0 ? `Falls ${fall} cm below the hip.` : `Sits ${-fall} cm above the hip.`}`;
    document.getElementById('len').textContent = `Garment length ${LENGTH[i]} cm · chest ${CHEST[i]} cm. Hem altered on request, complimentary.`;
  }
  form.addEventListener('input', predict);
  predict();
</script>
</body>
</html>
