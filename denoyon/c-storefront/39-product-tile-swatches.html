<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>39 · Product tile with garment swatches — DE NOYON</title>
<link rel="stylesheet" href="components.css">
<style>
  main { padding-top: var(--sp-9); padding-bottom: var(--sp-9); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-7) var(--grid-gap); }
  @media (max-width: 1080px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }

  /* Product tiles have no card chrome: the image edge is the card. */
  .tile { position: relative; }
  .tile__media { position: relative; display: block; border: 0; padding: 0; }
  .tile__media .dn-image { transition: background-color var(--dur-slow) var(--ease-drape); }
  .tile:hover .dn-image__fill { transform: scale(var(--hover-image-scale)); }
  .tile__sizes { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--sp-7) var(--sp-4) var(--sp-4); background: var(--scrim-bottom); display: flex; gap: var(--sp-3); font: var(--type-spec); color: var(--text-on-dark); opacity: 0; transition: opacity var(--dur-base) var(--ease-standard); }
  .tile__sizes s { color: var(--text-on-dark-muted); }
  .tile:hover .tile__sizes, .tile:focus-within .tile__sizes { opacity: 1; }
  .tile__save { position: absolute; top: var(--sp-3); right: var(--sp-3); width: 34px; height: 34px; display: grid; place-items: center; background: none; border: 0; cursor: pointer; opacity: 0; transition: opacity var(--dur-fast) var(--ease-standard); color: var(--ink-900); }
  .tile:hover .tile__save, .tile__save:focus-visible, .tile__save[aria-pressed="true"] { opacity: 1; }
  .tile__save[aria-pressed="true"] svg { fill: currentColor; }
  .tile__badge { position: absolute; top: var(--sp-3); left: var(--sp-3); background: var(--surface-page); }
  .tile__meta { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-2) var(--sp-4); margin-top: var(--sp-4); align-items: baseline; }
  .tile__name { font-family: var(--font-display); font-weight: var(--fw-light); font-size: var(--fs-h4); line-height: var(--lh-heading); border: 0; padding: 0; transition: var(--transition-control); }
  .tile:hover .tile__name { color: var(--gold-700); }
  .tile__colour { font: var(--type-spec); color: var(--text-muted); }
  .tile__meta .dn-swatches { grid-column: 1 / -1; margin-top: var(--sp-2); }
  /* image well tint follows the chosen garment */
  .tile[data-colour="bone"] .dn-image { background: var(--sand-100); }
  .tile[data-colour="limestone"] .dn-image { background: var(--limestone-deep); }
  .tile[data-colour="ink"] .dn-image { background: var(--ink-700); }
  .tile[data-colour="ink"] .dn-image__cap, .tile[data-colour="oxblood"] .dn-image__cap { color: var(--sand-300); }
  .tile[data-colour="oxblood"] .dn-image { background: var(--ox-700); }
</style>
</head>
<body>
<main class="dn-container">
  <div class="dn-eyebrow" style="margin-bottom:var(--sp-6)">Collection 04 · 4 pieces</div>
  <div class="grid" id="grid"></div>
</main>

<template id="tile">
  <article class="tile">
    <a class="tile__media" href="#">
      <div class="dn-image r-34"><div class="dn-image__fill"></div><p class="dn-image__cap"></p></div>
      <div class="tile__sizes" aria-hidden="true"></div>
    </a>
    <span class="dn-badge tile__badge" hidden></span>
    <button class="tile__save" type="button" aria-pressed="false" aria-label="Save">
      <svg class="dn-icon" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
    </button>
    <div class="tile__meta">
      <a class="tile__name" href="#"></a>
      <span class="dn-price"></span>
      <span class="tile__colour"></span>
      <fieldset class="dn-swatches"><legend class="sr" style="position:absolute;clip:rect(0 0 0 0)">Colour</legend></fieldset>
    </div>
  </article>
</template>

<script>
  const COLOURS = { bone: 'Bone', limestone: 'Limestone', ink: 'Ink', oxblood: 'Oxblood' };
  const PIECES = [
    { id: 'tee', name: 'Bias tee in silk-cotton jersey', price: '€ 280', colours: ['bone', 'limestone', 'ink', 'oxblood'], badge: ['1 of 12', 'gold'],
      sizes: { 'EU 34': 1, 'EU 36': 1, 'EU 38': 0, 'EU 40': 1, 'EU 42': 1 } },
    { id: 'ls', name: 'Long-sleeve bias tee', price: '€ 340', colours: ['bone', 'ink'], sizes: { 'EU 34': 0, 'EU 36': 1, 'EU 38': 1, 'EU 40': 1, 'EU 42': 0 } },
    { id: 'shell', name: 'Draped shell in silk-cotton', price: '€ 360', colours: ['limestone', 'oxblood'], badge: ['Made to order', 'sage'], sizes: { 'EU 36': 1, 'EU 38': 1, 'EU 40': 1 } },
    { id: 'archive', name: 'Archive tee, 1972 cut', price: '<s>€ 320</s>€ 220', colours: ['ink'], badge: ['Final piece', 'oxblood'], sizes: { 'EU 38': 1 } },
  ];
  const tpl = document.getElementById('tile');
  const grid = document.getElementById('grid');
  PIECES.forEach((p) => {
    const el = tpl.content.firstElementChild.cloneNode(true);
    const set = (c) => {
      el.dataset.colour = c;
      el.querySelector('.tile__colour').textContent = COLOURS[c];
      el.querySelector('.dn-image__cap').textContent = `${p.name} in ${COLOURS[c].toLowerCase()} · flat on stone, overhead`;
    };
    el.querySelector('.tile__name').textContent = p.name;
    el.querySelector('.dn-price').innerHTML = p.price;
    el.querySelector('.tile__sizes').innerHTML = Object.entries(p.sizes).map(([s, q]) => q ? `<span>${s}</span>` : `<s>${s}</s>`).join('');
    if (p.badge) { const b = el.querySelector('.tile__badge'); b.hidden = false; b.textContent = p.badge[0]; b.classList.add(`dn-badge--${p.badge[1]}`); }
    const fs = el.querySelector('.dn-swatches');
    p.colours.forEach((c, i) => {
      const l = document.createElement('label');
      l.className = 'dn-swatch'; l.title = COLOURS[c];
      l.innerHTML = `<input type="radio" name="c-${p.id}" value="${c}" ${i ? '' : 'checked'} aria-label="${COLOURS[c]}"><span class="sw-${c}"></span>`;
      l.querySelector('input').addEventListener('change', () => set(c));
      fs.appendChild(l);
    });
    const save = el.querySelector('.tile__save');
    save.addEventListener('click', () => save.setAttribute('aria-pressed', save.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'));
    set(p.colours[0]);
    grid.appendChild(el);
  });
</script>
</body>
</html>
