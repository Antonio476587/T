<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>47 · Inline measurements and fitting card — DE NOYON</title>
<link rel="stylesheet" href="components.css">
<style>
  main { padding-top: var(--sp-9); padding-bottom: var(--sp-9); display: grid; grid-template-columns: 7fr 5fr; gap: var(--grid-gap); align-items: stretch; }
  .panel { background: var(--surface-card); border: var(--border-hairline); padding: var(--sp-7) var(--sp-6); }
  .tabs { display: flex; gap: var(--sp-6); border-bottom: var(--border-hairline); margin-bottom: var(--sp-6); }
  .tabs button { background: none; border: 0; padding: 0 0 var(--sp-3); font: var(--type-eyebrow); letter-spacing: var(--tr-label); text-transform: uppercase; color: var(--text-secondary); cursor: pointer; box-shadow: none; transition: var(--transition-control); }
  .tabs button[aria-selected="true"] { color: var(--text-primary); box-shadow: inset 0 -1px 0 var(--metal-hairline); }
  .meas { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-7); align-items: center; }
  .meas svg { width: 100%; height: auto; }
  .meas svg .g { fill: var(--surface-raised); stroke: var(--ink-900); stroke-width: 1; }
  .meas svg .m { stroke: var(--brass); stroke-width: 1; }
  .meas svg .tick { stroke: var(--brass); stroke-width: 1; }
  .meas svg text { font: 400 10px var(--font-mono); fill: var(--ink-900); }
  dl { margin: 0; display: grid; grid-template-columns: 1fr auto; font: var(--type-spec); }
  dt, dd { padding: var(--sp-3) 0; border-bottom: var(--border-hairline); margin: 0; }
  dt { color: var(--text-muted); text-transform: uppercase; letter-spacing: var(--tr-label); }
  .fitting { background: var(--surface-plaster); border: var(--border-hairline); box-shadow: var(--inlay-brass); padding: var(--sp-7) var(--sp-6); display: flex; flex-direction: column; justify-content: space-between; gap: var(--sp-7); }
  .fitting h2 { margin: var(--sp-3) 0 var(--sp-4); }
  .fitting p { color: var(--text-secondary); }
  .slots { display: grid; gap: var(--sp-2); }
  .slot { position: relative; }
  .slot input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .slot span { display: flex; justify-content: space-between; padding: var(--sp-3) var(--sp-4); border: var(--border-strong); font: var(--type-spec); transition: var(--transition-control); background: var(--surface-card); }
  .slot input:checked + span { background: var(--ink-900); color: var(--bone); border-color: var(--ink-900); }
  .slot input:disabled + span { color: var(--state-disabled-fg); text-decoration: line-through; border-color: var(--line-hairline); background: transparent; }
  .slot input:focus-visible + span { outline: 1px solid var(--focus-ring); outline-offset: 3px; }
  .confirm { font: var(--type-spec); min-height: 1.5em; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } .meas { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="dn-container">
  <section class="panel" aria-labelledby="mt">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-s="EU 36">EU 36</button>
      <button role="tab" aria-selected="false" data-s="EU 38">EU 38</button>
      <button role="tab" aria-selected="false" data-s="EU 40">EU 40</button>
    </div>
    <h2 id="mt" class="dn-label" style="margin-bottom:var(--sp-5)">Measurements · <span id="cur">EU 36</span></h2>
    <div class="meas">
      <svg viewBox="0 0 240 260" aria-hidden="true">
        <path class="g" d="M84 20 Q120 38 156 20 L214 48 L196 92 L170 80 L176 244 L64 244 L70 80 L44 92 L26 48 Z"/>
        <line class="m" x1="70" y1="98" x2="170" y2="98"/><line class="tick" x1="70" y1="94" x2="70" y2="102"/><line class="tick" x1="170" y1="94" x2="170" y2="102"/>
        <text x="120" y="92" text-anchor="middle" id="tA">92</text>
        <line class="m" x1="200" y1="20" x2="200" y2="244" transform="translate(22 0)"/>
        <text x="228" y="136" text-anchor="middle" transform="rotate(90 228 136)" id="tB">63</text>
        <line class="m" x1="64" y1="236" x2="176" y2="236"/>
        <text x="120" y="230" text-anchor="middle" id="tD">96</text>
      </svg>
      <dl id="dl"></dl>
    </div>
  </section>

  <aside class="fitting" aria-labelledby="ft">
    <div>
      <div class="dn-eyebrow">Atelier · Paris, 8e</div>
      <h2 id="ft">Book a fitting.</h2>
      <p>Forty minutes with the cutter. The three lengths are tried against the body, and the hem is marked before dispatch.</p>
    </div>
    <form class="slots" id="slots">
      <label class="slot"><input type="radio" name="slot" value="Thu 08.10 · 11h00"><span>Thu 08.10<b>11h00</b></span></label>
      <label class="slot"><input type="radio" name="slot" value="Thu 08.10 · 15h00" disabled><span>Thu 08.10<b>15h00</b></span></label>
      <label class="slot"><input type="radio" name="slot" value="Fri 09.10 · 10h00"><span>Fri 09.10<b>10h00</b></span></label>
      <label class="slot"><input type="radio" name="slot" value="Sat 10.10 · 12h00"><span>Sat 10.10<b>12h00</b></span></label>
      <button class="dn-btn dn-btn--block" type="submit" style="margin-top:var(--sp-3)">Book a fitting</button>
      <p class="confirm" role="status" id="confirm"></p>
    </form>
  </aside>
</main>
<script>
  const DATA = { 'EU 36': [92, 63, 37, 96], 'EU 38': [96, 64, 38, 100], 'EU 40': [100, 65, 39, 104] };
  const LABELS = ['Chest', 'Length', 'Shoulder', 'Hem'];
  function show(s) {
    const d = DATA[s];
    document.getElementById('cur').textContent = s;
    document.getElementById('dl').innerHTML = d.map((v, i) => `<dt>${LABELS[i]}</dt><dd>${v} cm</dd>`).join('');
    document.getElementById('tA').textContent = d[0]; document.getElementById('tB').textContent = d[1]; document.getElementById('tD').textContent = d[3];
  }
  document.querySelectorAll('[role=tab]').forEach((t) => t.addEventListener('click', () => {
    document.querySelectorAll('[role=tab]').forEach((x) => x.setAttribute('aria-selected', x === t));
    show(t.dataset.s);
  }));
  show('EU 36');
  document.getElementById('slots').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = e.target.slot.value;
    document.getElementById('confirm').textContent = v ? `Fitting held · ${v}. Confirmation sent.` : 'Select a time.';
  });
</script>
</body>
</html>
